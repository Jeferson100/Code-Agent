name: Get Models
on:
    schedule:
        - cron: '0 0 * * 0'
    workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Copia os arquivos do repo
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.1'
      
      - name: Instalar o uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      
      - name: Criar ambiente virtual
        run: |
          uv venv
      
      - name: Instalar o biblioteca
        run: |
          make uv_install
      
      - name: Executar o script
        run: |
          uv run python data/get_models.py

      - name: Configure Git
        run: |
            git config --global user.email "sehnemjeferson@gmail.com"
            git config --global user.name "Jeferson Sehnem"
        
      - name: Commit and push changes
        run: |
            git add .
            git commit -m "Update models: $(date +'%Y-%m-%d')"
            git push 
        env:
          GITHUB_TOKEN: ${{ secrets.GET_MODELS_GITHUB_TOKEN }}